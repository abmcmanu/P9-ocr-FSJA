version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# MicroCRM – orchestration Docker Compose
# Usage : docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Back-end Spring Boot ───────────────────────────────────────────────────
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    image: orion-microcrm-back:latest
    container_name: microcrm-back
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - microcrm-net
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Front-end Angular / Caddy ──────────────────────────────────────────────
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    image: orion-microcrm-front:latest
    container_name: microcrm-front
    restart: unless-stopped
    ports:
      - "9090:80"
    networks:
      - microcrm-net
    depends_on:
      back:
        condition: service_healthy

# ── Réseau interne isolé ──────────────────────────────────────────────────────
networks:
  microcrm-net:
    driver: bridge
    name: microcrm-net
