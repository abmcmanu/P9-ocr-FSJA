name: Release – Versioning Sémantique

# ─────────────────────────────────────────────────────────────────────────────
# Déclenchement :
#   • push d'un tag suivant la convention SemVer : vX.Y.Z (ex. v1.2.3)
#   • La release est créée par un humain via : git tag v1.0.0 && git push --tags
#
# Politique de versioning (SemVer) :
#   MAJOR (X) : changements incompatibles d'API
#   MINOR (Y) : nouvelles fonctionnalités rétrocompatibles
#   PATCH (Z) : correctifs rétrocompatibles
#
# Branches :
#   • Développement : feature/* → develop
#   • Stabilisation : develop → main
#   • Release : tag vX.Y.Z sur main → déclenchement de ce workflow
#   • Une release humaine (tag) est requise – pas de release automatique par commit
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    name: Créer la GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Extraction de la version depuis le tag ────────────────────────────
      - name: Extraire la version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # ── 3. Build du back-end ─────────────────────────────────────────────────
      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Rendre gradlew exécutable
        run: chmod +x back/gradlew

      - name: Build du JAR de release
        # objective  : produire le JAR versionné pour la release
        # where      : back/build.gradle
        # when       : déclenchement sur tag vX.Y.Z
        working-directory: back
        run: |
          ./gradlew build -x test --no-daemon
          # Renommer le JAR avec la version du tag pour lisibilité
          mv build/libs/microcrm-0.0.1-SNAPSHOT.jar \
             build/libs/microcrm-${{ steps.version.outputs.VERSION }}.jar

      # ── 4. Build du front-end ────────────────────────────────────────────────
      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Installation des dépendances npm
        working-directory: front
        run: npm ci

      - name: Build Angular de release
        # objective  : produire le bundle Angular optimisé pour la release
        # where      : front/package.json – script "build"
        # when       : déclenchement sur tag vX.Y.Z
        working-directory: front
        run: npx ng build --configuration=production

      - name: Créer une archive du dist Angular
        working-directory: front
        run: |
          cd dist
          zip -r ../microcrm-front-${{ steps.version.outputs.VERSION }}.zip microcrm/

      # ── 5. Génération du Changelog depuis les commits ────────────────────────
      - name: Générer le changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" | head -20)
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..${{ steps.version.outputs.VERSION }} \
              --pretty=format:"- %s (%h)")
          fi
          # Échapper pour GitHub Actions
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          echo "CHANGELOG=$CHANGELOG" >> $GITHUB_OUTPUT

      # ── 6. Création de la GitHub Release ────────────────────────────────────
      - name: Créer la GitHub Release avec artefacts
        # objective  : publier la release GitHub avec JAR et dist Angular
        # when       : après build des deux artefacts
        uses: softprops/action-gh-release@v2
        with:
          name: "MicroCRM ${{ steps.version.outputs.VERSION }}"
          body: |
            ## Changements dans ${{ steps.version.outputs.VERSION }}

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---
            ### Artefacts inclus
            - `microcrm-${{ steps.version.outputs.VERSION }}.jar` – Back-end Spring Boot (Java 17)
            - `microcrm-front-${{ steps.version.outputs.VERSION }}.zip` – Front-end Angular (bundle production)

            ### Démarrage rapide
            ```bash
            # Back-end
            java -jar microcrm-${{ steps.version.outputs.VERSION }}.jar

            # Ou via Docker Compose
            docker compose up
            ```
          files: |
            back/build/libs/microcrm-${{ steps.version.outputs.VERSION }}.jar
            front/microcrm-front-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-rc') || contains(steps.version.outputs.VERSION, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 7. Build et push des images Docker taguées ──────────────────────────
      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push image back-end taguée
        uses: docker/build-push-action@v5
        with:
          context: ./back
          file: ./back/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orion-microcrm-back:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/orion-microcrm-back:latest

      - name: Build et push image front-end taguée
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orion-microcrm-front:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/orion-microcrm-front:latest
