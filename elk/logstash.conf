# ─────────────────────────────────────────────────────────────────────────────
# Logstash Pipeline – MicroCRM
#
# Sources :
#   - Port 5000 TCP  : logs JSON structurés depuis Spring Boot
#                      (via logstash-logback-encoder)
#   - Port 5044 Beats: logs via Filebeat (optionnel)
#
# Destination :
#   - Elasticsearch  : index microcrm-logs-YYYY.MM.dd
# ─────────────────────────────────────────────────────────────────────────────

input {

  # ── Entrée TCP : logs JSON Spring Boot ──────────────────────────────────────
  tcp {
    port  => 5000
    codec => json_lines
    type  => "springboot"
  }

  # ── Entrée Beats (Filebeat) : logs fichier ────────────────────────────────
  beats {
    port => 5044
    type => "beats"
  }
}

filter {

  # ── Traitement des logs Spring Boot ──────────────────────────────────────
  if [type] == "springboot" {

    # Normalisation du niveau de log
    if [level] {
      mutate {
        uppercase => ["level"]
      }
    }

    # Extraction du timestamp depuis le champ @timestamp Spring Boot
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }

    # Tag des erreurs pour faciliter les alertes Kibana
    if [level] in ["ERROR", "WARN"] {
      mutate {
        add_tag => ["alert"]
      }
    }

    # Extraction du stack trace si présent
    if [stack_trace] {
      mutate {
        add_tag => ["has_exception"]
      }
    }

    # Ajout du service source
    mutate {
      add_field => {
        "service" => "microcrm-back"
        "environment" => "${ENV:local}"
      }
    }
  }

  # ── Traitement des logs Beats / Filebeat ──────────────────────────────────
  if [type] == "beats" {
    mutate {
      add_field => {
        "service" => "microcrm-front"
        "environment" => "${ENV:local}"
      }
    }
  }

  # ── Suppression des champs internes inutiles ──────────────────────────────
  mutate {
    remove_field => ["host", "agent", "ecs", "input", "log", "tags_normalized"]
  }
}

output {

  # ── Envoi vers Elasticsearch ──────────────────────────────────────────────
  elasticsearch {
    hosts     => ["http://elasticsearch:9200"]
    index     => "microcrm-logs-%{+YYYY.MM.dd}"
    # user   => "elastic"
    # password => "${ELASTIC_PASSWORD}"
  }

  # ── Debug local (à désactiver en production) ──────────────────────────────
  stdout {
    codec => rubydebug
  }
}
